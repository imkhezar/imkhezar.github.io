<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEDE6"/>
      <stop offset="1" stop-color="#C8E3D8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="20" fill="url(#bgWp)"/>

  <g stroke="#9FC9B8" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- browser window -->
  <rect x="130" y="110" width="540" height="340" rx="14" fill="#FFFFFF" stroke="#B9D8CB" stroke-width="2"/>

  <!-- window chrome -->
  <rect x="130" y="110" width="540" height="46" rx="14" fill="#F0F5F2"/>
  <circle cx="160" cy="133" r="7" fill="#FF6B4A"/>
  <circle cx="184" cy="133" r="7" fill="#F5C34D"/>
  <circle cx="208" cy="133" r="7" fill="#1F6F54"/>
  <rect x="260" y="123" width="330" height="20" rx="10" fill="#E4ECE8"/>

  <!-- page layout mock: header + two columns -->
  <rect x="160" y="180" width="480" height="50" rx="6" fill="#E7F1EC"/>
  <rect x="160" y="246" width="300" height="170" rx="6" fill="#E7F1EC"/>
  <rect x="474" y="246" width="166" height="170" rx="6" fill="#1F6F54" opacity="0.85"/>

  <!-- code tag mark -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="30" fill="#1F6F54">
    <text x="200" y="345" font-size="26">&lt;/&gt;</text>
  </g>

  <text x="400" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#12261E">
    WordPress Builds
  </text>
</svg>
