<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAds" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3D8"/>
      <stop offset="1" stop-color="#FFD1C2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="20" fill="url(#bgAds)"/>

  <!-- faint grid, echoes site background -->
  <g stroke="#F3B79E" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- growth bars, bottom right -->
  <g>
    <rect x="560" y="420" width="34" height="60" rx="4" fill="#1F6F54" opacity="0.85"/>
    <rect x="604" y="390" width="34" height="90" rx="4" fill="#1F6F54" opacity="0.85"/>
    <rect x="648" y="350" width="34" height="130" rx="4" fill="#1F6F54" opacity="0.85"/>
    <rect x="692" y="310" width="34" height="170" rx="4" fill="#FF6B4A"/>
  </g>

  <!-- floating tag pills -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="20" fill="#12261E">
    <rect x="90" y="120" width="150" height="46" rx="23" fill="#FFFFFF" opacity="0.9"/>
    <text x="165" y="150" text-anchor="middle">Meta Ads</text>

    <rect x="88" y="430" width="168" height="46" rx="23" fill="#FFFFFF" opacity="0.9"/>
    <text x="172" y="460" text-anchor="middle">Instagram</text>
  </g>

  <!-- central play badge -->
  <circle cx="400" cy="290" r="105" fill="#FFFFFF"/>
  <circle cx="400" cy="290" r="105" fill="none" stroke="#FF6B4A" stroke-width="4"/>
  <path d="M370 245 L370 335 L440 290 Z" fill="#FF6B4A"/>

  <!-- category label -->
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#12261E">
    Ads &amp; Motion Design
  </text>
</svg>
